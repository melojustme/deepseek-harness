<!doctype html>
<!-- Standalone design prototype. All tasks, execution events, checks, and diffs are simulated. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作调度 · 任务执行与审查原型</title>
<style>
:root{font:14px/1.55 Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#273344;background:#e9edf4;--blue:#3567dc;--muted:#778397;--line:#e4e9f1;--green:#20866a;--red:#b94949}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px}button:hover:not(:disabled){background:#f0f4ff;border-color:#bdcef6}button:disabled{opacity:.43;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8aafff;outline-offset:2px}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover:not(:disabled){background:#2856c5;color:white}.danger{color:var(--red)}.small{font-size:12px}.muted{color:var(--muted)}
.app{height:100vh;padding:22px;display:flex;flex-direction:column}.app.fullscreen{padding:0}.window{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid #d8e0ed;border-radius:15px;box-shadow:0 20px 65px #25375419;overflow:hidden;resize:both}.fullscreen .window{border-radius:0;resize:none}.header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 25px 16px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;display:grid;place-items:center;background:#eaf0ff;color:var(--blue);border-radius:11px;font-size:22px;font-weight:700}h1{font-size:18px;margin:0;letter-spacing:.4px}.subtitle{font-size:12px;color:var(--muted);margin-top:2px}.top-actions{display:flex;align-items:center;gap:9px}.pill{font-size:11px;padding:3px 8px;border-radius:5px;background:#edf3ff;color:#526fa5}.connection{font-size:12px;color:var(--green)}.connection::before{content:'●';margin-right:6px}.toolbar{display:flex;align-items:center;gap:12px;padding:14px 25px}.segmented{display:flex;padding:3px;background:#f1f4f8;border-radius:8px}.segmented button{border:0;background:transparent;padding:5px 13px;font-size:12px}.segmented button.active{background:#fff;box-shadow:0 1px 4px #22334416;color:var(--blue)}.toolbar input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:210px;min-width:80px}.toolbar select{border:1px solid var(--line);background:white;border-radius:8px;padding:7px}.capacity{margin-left:auto;font-size:12px;color:var(--muted)}.content{display:grid;grid-template-columns:minmax(0,1fr) 360px;flex:1;min-height:0;border-top:1px solid var(--line)}.board{background:#f7f9fc;padding:20px;overflow:auto;display:flex;gap:15px;align-items:stretch}.lane{min-width:180px;flex:1}.lane-title{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;margin:0 2px 14px}.dot{width:7px;height:7px;background:#a1aec1;border-radius:50%}.lane[data-kind=running] .dot{background:var(--blue)}.lane[data-kind=review] .dot{background:#b68a37}.lane[data-kind=approved] .dot{background:var(--green)}.count{color:#8d98aa;background:#e9edf4;border-radius:5px;padding:0 6px;margin-left:auto}.card{display:block;text-align:left;width:100%;padding:14px;margin-bottom:11px;border-radius:10px;box-shadow:0 2px 5px #24374d05;background:white}.card.selected{border-color:#87a7ef;box-shadow:0 0 0 2px #dbe6ff}.card-top{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#9099ab;margin-bottom:8px}.tag{color:#63759a;background:#f0f3f9;border-radius:4px;padding:1px 6px}.card h3{font-size:13px;font-weight:600;line-height:1.6;margin:0 0 8px}.card p{font-size:11px;color:#7c8798;margin:6px 0}.card-foot{border-top:1px solid #f0f2f7;margin-top:11px;padding-top:9px;display:flex;justify-content:space-between;align-items:center;font-size:10px}.status{color:var(--blue)}.status.review{color:#9a7128}.status.approved{color:var(--green)}.status.failed,.status.stopped{color:var(--red)}.progress{display:flex;gap:3px;margin:10px 0 5px}.progress span{height:4px;background:#e9edf3;flex:1;border-radius:3px}.progress span.done{background:#4c9a83}.progress span.current{background:#6f95ed}.empty-lane{padding:25px 10px;border:1px dashed #dce3ef;border-radius:9px;text-align:center;font-size:12px;color:#97a2b3}.inspector{border-left:1px solid var(--line);padding:22px;overflow:auto;background:#fff}.detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.detail-head button{padding:3px 8px;font-size:12px}.inspector h2{font-size:17px;line-height:1.6;margin:4px 0 10px}.detail-description{font-size:12px;color:#667286;line-height:1.9}.meta{display:grid;grid-template-columns:80px 1fr;gap:8px;font-size:12px;margin:17px 0}.meta dt{color:#8691a3}.meta dd{margin:0}.tabs{display:flex;border-bottom:1px solid var(--line);gap:18px;margin:22px 0 17px}.tabs button{border:0;border-radius:0;padding:7px 0;color:#7d8899;font-size:12px}.tabs button.active{color:var(--blue);border-bottom:2px solid var(--blue)}.section-title{font-size:12px;font-weight:600;margin:17px 0 10px}.check{font-size:12px;display:flex;gap:8px;margin:9px 0}.check b{color:var(--green);font-weight:500}.evidence{background:#f6f8fc;padding:12px;border-radius:8px;font-size:11px;line-height:1.9;overflow-wrap:anywhere}.notice{background:#fff9eb;border:1px solid #f3e7c4;color:#917232;padding:11px;border-radius:8px;font-size:11px;line-height:1.8;margin:13px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.actions button{font-size:12px}.feedback{width:100%;min-height:82px;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;font-size:12px}.feedback-label{display:block;font-size:12px;margin:18px 0 7px}.logs{font:11px/2 ui-monospace,Consolas,monospace;background:#f7f9fc;padding:12px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}.diff{font:11px/1.85 ui-monospace,Consolas,monospace;background:#f7f9fc;border:1px solid var(--line);border-radius:8px;overflow:hidden}.diff strong{display:block;padding:8px;color:#5c6b83;background:#edf1f7;font:11px/1.5 inherit}.diff div{padding:1px 9px;white-space:pre-wrap;overflow-wrap:anywhere}.diff .added{background:#eaf7ee;color:#257044}.diff .removed{background:#fff0ee;color:#b4534b}.demo{display:flex;flex-wrap:wrap;align-items:center;gap:7px;border-top:1px solid var(--line);padding:10px 20px;background:#fbfcfe;color:#7d8798;font-size:11px}.demo button{font-size:11px;padding:4px 9px}.demo strong{color:#536783;font-weight:500;margin-right:5px}.live{margin-left:auto;color:#426bbb}.overlay{position:fixed;inset:0;background:#19253766;z-index:5;display:grid;place-items:center;padding:20px}.overlay[hidden]{display:none}.dialog{background:#fff;border-radius:14px;padding:25px;width:min(480px,100%);box-shadow:0 20px 70px #0002}.dialog h2{font-size:19px;margin:0 0 18px}.field{display:block;font-size:12px;margin:13px 0 5px}.dialog input,.dialog textarea,.dialog select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px}.dialog textarea{min-height:80px}.dialog .actions{justify-content:flex-end}.toast{pointer-events:none;position:fixed;bottom:72px;left:50%;transform:translateX(-50%);max-width:90%;background:#263958;color:white;box-shadow:0 5px 20px #0002;border-radius:8px;padding:10px 17px;font-size:12px;z-index:9}.toast:empty{display:none}.back{display:none}.guide{font-size:11px;color:var(--muted);margin-top:14px}.guide a{color:var(--blue)}
@media(max-width:1200px){.content{grid-template-columns:minmax(0,1fr) 320px}.board{padding:15px;gap:12px}.lane{min-width:190px}.header{padding:15px 18px}.toolbar{padding:12px 18px}.toolbar input{width:150px}.inspector{padding:18px}.top-actions .connection{display:none}}
@media(max-width:760px){.app{padding:0}.window{border-radius:0;resize:none}.header{flex-wrap:wrap;gap:10px;padding:14px}.header .subtitle{font-size:10px}.top-actions{margin-left:auto}.toolbar{flex-wrap:wrap;padding:10px 14px;gap:8px}.toolbar input{flex:1}.capacity{margin-left:0}.content{display:block;overflow:auto}.board{min-height:100%;display:block;padding:14px}.lane{min-width:0;margin-bottom:22px}.inspector{display:none}.app.detail-open .inspector{display:block;position:fixed;inset:0;z-index:3;padding:20px}.back{display:inline-block}.demo{padding:9px 12px}.demo .live{flex-basis:100%;margin-left:0}.mode-button{display:none}.card{padding:14px}.pill{font-size:10px}.app.detail-open .demo{position:fixed;bottom:0;z-index:4;left:0;right:0}.app.detail-open .inspector{padding-bottom:180px}}
</style>
</head>
<body>
<main class="app" id="app">
<section class="window" aria-label="工作调度原型">
  <header class="header"><div class="brand"><div class="mark">≋</div><div><h1>工作调度 <span class="pill">设计原型</span></h1><div class="subtitle">deepseek-harness / 模型服务 · 从任务描述到可审查的交付</div></div></div><div class="top-actions"><span class="connection" id="connection">已连接（模拟）</span><button class="mode-button" id="fullscreen">全屏</button><button class="primary" id="newTask">＋ 新建任务</button></div></header>
  <div class="toolbar"><div class="segmented" aria-label="视图"><button class="active" id="boardView" aria-pressed="true">状态看板</button><button id="threadView" aria-pressed="false">线程视图</button></div><input id="search" type="search" aria-label="搜索任务" placeholder="搜索任务…"><select id="threadFilter" aria-label="筛选线程"><option value="all">全部线程</option><option>接口开发</option><option>质量保障</option></select><span class="capacity" id="capacity"></span></div>
  <div class="content"><div class="board" id="board" aria-label="任务看板"></div><aside class="inspector" id="details" aria-label="任务详情"></aside></div>
  <footer class="demo"><strong>原型演示 · 全部数据均为模拟</strong><button id="advance">推进演示</button><button id="approval">模拟审批</button><button id="failure">模拟失败</button><button id="offline">模拟断线</button><button id="reset">重置</button><span class="live" id="live" aria-live="polite">选择任务，体验执行与审查</span></footer>
</section>
</main>
<div class="overlay" id="createOverlay" hidden><form class="dialog" id="createForm" role="dialog" aria-modal="true" aria-labelledby="createTitle"><h2 id="createTitle">新建任务</h2><p class="small muted">保存到待办。点击执行后才会提交给模型。</p><label class="field" for="taskTitle">任务标题</label><input id="taskTitle" required placeholder="例如：为登录接口增加限流"><label class="field" for="taskDescription">任务描述</label><textarea id="taskDescription" required placeholder="描述预期行为和必要背景"></textarea><label class="field" for="taskAcceptance">验收条件</label><textarea id="taskAcceptance" required placeholder="如何确认任务已完成"></textarea><label class="field" for="taskThread">工作线程</label><select id="taskThread"><option>接口开发</option><option>质量保障</option></select><div class="actions"><button type="button" id="cancelCreate">取消</button><button class="primary" type="submit">保存待办</button></div></form></div>
<div class="toast" id="toast" role="status"></div>
<script>
const initial = [
 {id:'WS-024',title:'为登录接口增加限流',description:'对短时间重复请求返回明确提示，保留正常登录体验。',acceptance:['同一来源每分钟最多 10 次请求','超出限制返回 429 和重试时间','边界与正常路径测试通过'],thread:'接口开发',state:'ready',step:0,attempt:0,log:[],history:[]},
 {id:'WS-025',title:'补充 API 错误提示',description:'统一会话失效与服务不可用时的错误文案。',acceptance:['错误包含可执行的下一步','现有请求格式保持一致'],thread:'接口开发',state:'ready',step:0,attempt:0,log:[],history:[]},
 {id:'WS-021',title:'修复会话重连后的状态同步',description:'断线重连后从最新快照恢复任务状态，忽略旧版本通知。',acceptance:['重连恢复真实状态','过期通知不覆盖快照','相关测试通过'],thread:'质量保障',state:'review',step:3,attempt:1,log:['00:00 接收任务，建立隔离 worktree','00:08 修改 reconnect.ts','00:19 pnpm exec vitest run reconnect.spec.ts → exit 0','00:23 执行正常结束，证据版本 e1 已固定'],history:[]},
 {id:'WS-022',title:'覆盖重复执行请求的测试',description:'验证重复提交同一任务时只创建一个执行轮次。',acceptance:['重复命令返回同一轮次','模型输入只被接收一次'],thread:'质量保障',state:'ready',step:0,attempt:0,log:[],history:[]},
 {id:'WS-019',title:'完善工作区空状态',description:'没有工作区时提供清晰入口，禁用无法执行的操作。',acceptance:['空状态可通过键盘操作'],thread:'接口开发',state:'approved',step:3,attempt:1,log:['执行与检查完成','用户已通过审查 · e1'],history:['第 1 轮：通过审查']}
];
let tasks=structuredClone(initial), selected='WS-021', view='board', tab='overview', connected=true, toastTimer;
const $=id=>document.getElementById(id);
const escape=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const labels={ready:'待办',queued:'排队中',running:'执行中',waiting:'等待审批',review:'待审查',approved:'已通过',failed:'执行失败',stopped:'已停止'};
const stages=['分析任务与验收条件','实现修改并执行检查','整理执行证据'];
const active=()=>tasks.find(task=>['running','waiting'].includes(task.state));
const chosen=()=>tasks.find(task=>task.id===selected);
function notify(text){$('live').textContent=text;$('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',3200)}
function column(task){return ['queued','running','waiting'].includes(task.state)?'running':task.state==='review'?'review':task.state==='approved'?'approved':'ready'}
function prior(task){return tasks.find(item=>item.thread===task.thread&&item.id!==task.id&&tasks.indexOf(item)<tasks.indexOf(task)&&item.state!=='approved')}
function launch(task){task.state='running';task.step=0;task.attempt+=1;task.session='session-'+task.id.toLowerCase()+'-'+task.attempt;task.log=['00:00 接收任务 · 第 '+task.attempt+' 轮','00:01 建立隔离 worktree（模拟）','00:02 提交原生 Session 输入（模拟）'];if(task.feedback)task.log.push('返工意见：'+task.feedback);task.feedback=''}
function pump(){if(active())return;const next=tasks.find(task=>task.state==='queued'&&!prior(task));if(next)launch(next)}
function execute(task){if(!connected)return;if(active()||prior(task)){task.state='queued';notify('已排队，等待前置任务通过或执行额度')}else{launch(task);notify('已开始第 '+task.attempt+' 轮执行（模拟）')}tab='overview';render()}
function render(){
 $('connection').textContent=connected?'已连接（模拟）':'连接已断开';$('connection').style.color=connected?'#20866a':'#b94949';$('offline').textContent=connected?'模拟断线':'恢复连接';$('capacity').textContent=`运行 ${active()?1:0} / 1 · 排队 ${tasks.filter(task=>task.state==='queued').length}`;$('newTask').disabled=!connected;
 const query=$('search').value.trim().toLowerCase(),thread=$('threadFilter').value;
 const visible=tasks.filter(task=>(thread==='all'||thread===task.thread)&&(task.title+task.description).toLowerCase().includes(query));
 const groups=view==='board'?[['ready','待办'],['running','执行中'],['review','待审查'],['approved','已通过']]:[['接口开发','接口开发'],['质量保障','质量保障']];
 $('board').innerHTML=groups.map(([kind,name])=>{const rows=visible.filter(task=>view==='board'?column(task)===kind:task.thread===kind);return `<section class="lane" data-kind="${kind}" aria-label="${name}"><h2 class="lane-title"><span class="dot"></span>${name}<span class="count">${rows.length}</span></h2>${rows.map(task=>`<button class="card ${selected===task.id?'selected':''}" data-task="${task.id}" aria-label="${escape(task.title)}，${labels[task.state]}"><div class="card-top"><span>${task.id}</span><span class="tag">${task.thread}</span></div><h3>${escape(task.title)}</h3><p>${task.acceptance.length} 项验收条件${task.attempt?' · 第 '+task.attempt+' 轮':''}</p>${['running','waiting'].includes(task.state)?`<div class="progress" role="progressbar" aria-label="工作进度" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${task.step}">${stages.map((_,i)=>`<span class="${i<task.step?'done':i===task.step?'current':''}"></span>`).join('')}</div><p>${task.state==='waiting'?'需要确认一次命令执行':stages[task.step]}</p>`:''}<div class="card-foot"><span class="status ${task.state}">${labels[task.state]}</span><span>${task.state==='review'?'查看结果 →':task.state==='approved'?'产物保留在 worktree':'查看详情 →'}</span></div></button>`).join('')||'<div class="empty-lane">暂无任务</div>'}</section>`}).join('');
 document.querySelectorAll('[data-task]').forEach(button=>button.onclick=()=>{selected=button.dataset.task;tab='overview';$('app').classList.add('detail-open');render()});renderDetails();
 ['boardView','threadView'].forEach((id,index)=>{const enabled=(view==='board')===(index===0);$(id).classList.toggle('active',enabled);$(id).setAttribute('aria-pressed',String(enabled))});
 const task=chosen();$('advance').disabled=!connected||!task||!['running','waiting'].includes(task.state);$('approval').disabled=!connected||task?.state!=='running';$('failure').disabled=!connected||!['running','waiting'].includes(task?.state);
}
function renderDetails(){const task=chosen();if(!task){$('details').innerHTML='<p class="muted">选择任务查看详情</p>';return}const reviewing=task.state==='review',busy=['running','waiting','queued'].includes(task.state),blocked=!connected;
 $('details').innerHTML=`<div class="detail-head"><span class="small muted">${task.id} · 任务详情</span><button class="back" id="back">返回看板</button><span class="pill">${labels[task.state]}</span></div><h2>${escape(task.title)}</h2><p class="detail-description">${escape(task.description)}</p><dl class="meta"><dt>工作线程</dt><dd>${task.thread}</dd><dt>执行轮次</dt><dd>${task.attempt?'第 '+task.attempt+' 轮 · 专属 Session':'尚未执行'}</dd><dt>执行环境</dt><dd>隔离 Git worktree <span class="muted">· 模拟</span></dd></dl><div class="tabs" aria-label="详情内容">${[['overview','概览'],['log','执行记录'],['diff','文件差异']].map(([id,name])=>`<button data-tab="${id}" class="${tab===id?'active':''}" aria-pressed="${tab===id}">${name}</button>`).join('')}</div><div id="tabBody"></div>${!connected?'<div class="notice">连接已断开，当前为最后快照。恢复连接后才能执行或审查。</div>':''}<div id="taskActions"></div>`;
 const body=$('tabBody');
 if(tab==='overview'){body.innerHTML=`<div class="section-title">验收条件</div>${task.acceptance.map(text=>`<div class="check"><b>${task.step===3?'✓':'○'}</b><span>${escape(text)}</span></div>`).join('')}${task.attempt?`<div class="section-title">执行摘要</div><div class="evidence">${reviewing||task.state==='approved'?'修改已完成，相关检查已运行。请结合文件差异确认结果。':task.state==='failed'?'检查失败：收到非零退出码。请查看执行记录。':task.state==='stopped'?'执行已停止，现有产物保留供检查。':task.state==='waiting'?'等待原生审批。批准后继续当前轮次。':'正在收集执行证据。'}<br>${task.step===3?'检查：3 项通过 · exit 0（模拟）<br>证据版本：e'+task.attempt:'检查：未完成'}</div>`:''}${reviewing?'<div class="notice">通过审查仅确认本轮结果。修改保留在 worktree，不会自动合入当前分支。</div>':''}${task.state==='queued'?'<div class="notice">'+(prior(task)?'等待前置任务「'+escape(prior(task).title)+'」通过审查。':'等待执行额度。')+'</div>':''}${!task.attempt?'<div class="notice">执行基于当前 HEAD，原工作区未提交改动不带入；提供者可创建仅本地的内部快照提交。原型不会访问 Git 或模型。</div>':''}${task.history.length?'<div class="section-title">审查历史</div><div class="evidence">'+task.history.map(escape).join('<br>')+'</div>':''}`}
 else if(tab==='log'){body.innerHTML='<div class="section-title">本轮记录 · 模拟数据</div><pre class="logs">'+escape(task.log.join('\n')||'尚无执行记录')+'</pre><p class="guide">正式实现从原生 Session 日志与工具结果读取，可跳转查看完整记录和审批。</p>'}
 else {body.innerHTML=task.step===3?`<div class="section-title">2 个文件 · +5 −1 <span class="muted">示例差异</span></div><div class="diff"><strong>src/${task.id==='WS-021'?'reconnect':'rate-limit'}.ts · 修改</strong><div>  export function accept(request) {</div><div class="removed">−   return true;</div><div class="added">+   const remaining = budget.remaining(request);</div><div class="added">+   return remaining &gt; 0;</div><div>  }</div><strong>tests/request.spec.ts · 新增</strong><div class="added">+ it('rejects repeated requests', () =&gt; {</div><div class="added">+   expect(result.status).toBe(429);</div><div class="added">+ });</div></div><p class="guide">固定证据 e${task.attempt} · 文件变化后需重新审查。此处为排版样例，不对应真实仓库修改。</p>`:'<div class="evidence">执行证据尚未固定。正常结束后显示本轮文件差异。</div>'}
 let controls='';
 if(['ready','failed','stopped'].includes(task.state))controls=`<div class="actions"><button class="primary" id="execute" ${blocked?'disabled':''}>${task.attempt?'重试任务':'执行任务'}</button><button id="moveUp" ${blocked?'disabled':''}>上移</button><button id="moveDown" ${blocked?'disabled':''}>下移</button></div>`;
 if(busy)controls=`<div class="actions">${task.state==='waiting'?`<button class="primary" id="resolveApproval" ${blocked?'disabled':''}>打开审批（演示）</button>`:''}<button class="danger" id="stop" ${blocked?'disabled':''}>${task.state==='queued'?'取消排队':'停止执行'}</button><button id="showLog">查看执行记录</button></div>`;
 if(reviewing)controls=`<label class="feedback-label" for="feedback">返工意见</label><textarea class="feedback" id="feedback" placeholder="说明需要修改的内容…">${escape(task.feedback||'')}</textarea><div class="actions"><button class="primary" id="approve" ${blocked?'disabled':''}>通过审查</button><button id="rework" ${blocked||!task.feedback?.trim()?'disabled':''}>提交返工</button></div>`;
 if(task.state==='approved')controls='<div class="notice">第 '+task.attempt+' 轮已通过。产物仍在隔离 worktree，未提交到用户分支、未推送或合并。</div>';
 $('taskActions').innerHTML=controls;
 document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{tab=button.dataset.tab;renderDetails()});$('back').onclick=()=>{$('app').classList.remove('detail-open');document.querySelector(`[data-task="${task.id}"]`)?.focus()};
 if($('execute'))$('execute').onclick=()=>execute(task);
 for(const [id,direction] of [['moveUp',-1],['moveDown',1]])if($(id))$(id).onclick=()=>{const rows=tasks.filter(item=>item.thread===task.thread);const peer=rows[rows.indexOf(task)+direction];if(!peer||peer.state!=='ready'){notify('只能调整相邻待办任务的顺序');return}const a=tasks.indexOf(task),b=tasks.indexOf(peer);[tasks[a],tasks[b]]=[tasks[b],tasks[a]];render()};
 if($('stop'))$('stop').onclick=()=>{task.state='stopped';task.log.push('用户请求停止 → 执行资源已退出（模拟）');notify('已停止；正式实现须等待执行资源退出');pump();render()};
 if($('showLog'))$('showLog').onclick=()=>{tab='log';renderDetails()};
 if($('resolveApproval'))$('resolveApproval').onclick=()=>{task.state='running';task.log.push('用户通过命令审批（模拟）');notify('审批已通过，继续当前轮次');render()};
 if($('feedback'))$('feedback').oninput=event=>{task.feedback=event.target.value;$('rework').disabled=!connected||!task.feedback.trim()};
 if($('approve'))$('approve').onclick=()=>{task.state='approved';task.history.push(`第 ${task.attempt} 轮：通过证据 e${task.attempt}`);task.log.push('人工通过审查，产物保留');notify('审查已通过；未合并到用户分支');pump();render()};
 if($('rework'))$('rework').onclick=()=>{if(!task.feedback?.trim())return;task.history.push(`第 ${task.attempt} 轮：返工 · ${task.feedback.trim()}`);task.state='ready';execute(task);notify('返工意见已进入新轮次（模拟）')};
}
$('advance').onclick=()=>{const task=chosen();if(task.state==='waiting'){notify('请先在任务详情中处理审批');return}task.step+=1;task.log.push('00:'+String(task.step*8).padStart(2,'0')+' '+stages[task.step-1]+' · 完成（模拟）');if(task.step===3){task.state='review';task.log.push('检查 exit 0 · 证据 e'+task.attempt+' 已固定（模拟）');notify('执行正常结束，等待人工审查');pump()}else notify('当前步骤：'+stages[task.step]);render()};
$('approval').onclick=()=>{const task=chosen();task.state='waiting';task.log.push('等待用户审批一次检查命令');notify('任务正在等待用户操作');render()};
$('failure').onclick=()=>{const task=chosen();task.state='failed';task.log.push('检查 exit 1 → 执行失败（模拟）');notify('执行失败，不能通过审查');pump();render()};
$('offline').onclick=()=>{connected=!connected;notify(connected?'已恢复连接并读取最新快照（模拟）':'连接已断开；操作已禁用');render()};
$('reset').onclick=()=>{tasks=structuredClone(initial);selected='WS-021';tab='overview';connected=true;$('search').value='';$('threadFilter').value='all';notify('已恢复初始演示数据');render()};
$('search').oninput=render;$('threadFilter').onchange=render;$('boardView').onclick=()=>{view='board';render()};$('threadView').onclick=()=>{view='thread';render()};
$('fullscreen').onclick=()=>{const enabled=$('app').classList.toggle('fullscreen');$('fullscreen').textContent=enabled?'还原':'全屏'};
function closeCreate(){$('createOverlay').hidden=true;$('newTask').focus()}
$('newTask').onclick=()=>{$('createOverlay').hidden=false;$('createForm').reset();$('taskTitle').focus()};$('cancelCreate').onclick=closeCreate;
$('createForm').onsubmit=event=>{event.preventDefault();if(!connected){notify('请先恢复连接');return}const title=$('taskTitle').value.trim(),description=$('taskDescription').value.trim(),acceptance=$('taskAcceptance').value.trim();if(!title||!description||!acceptance)return;const task={id:'WS-'+String(26+tasks.length-initial.length).padStart(3,'0'),title,description,acceptance:acceptance.split('\n').filter(Boolean),thread:$('taskThread').value,state:'ready',step:0,attempt:0,log:[],history:[]};tasks.push(task);selected=task.id;tab='overview';closeCreate();render();notify('任务已保存到待办，尚未执行')};
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!$('createOverlay').hidden)closeCreate();else if($('app').classList.contains('detail-open')){$('app').classList.remove('detail-open');document.querySelector(`[data-task="${selected}"]`)?.focus()}}if(event.key==='Tab'&&!$('createOverlay').hidden){const controls=[...$('createForm').querySelectorAll('input,textarea,select,button')].filter(element=>!element.disabled);const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
render();
</script>
</body>
</html>
