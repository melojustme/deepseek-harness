.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
  (() =&gt; {

    const state={page:&#x27;board&#x27;,configured:true,phase:&#x27;todo&#x27;,selected:1,round:1,feedback:&#x27;&#x27;,compact:false};

    const names={todo:&#x27;待办&#x27;,running:&#x27;执行中&#x27;,review:&#x27;待审查&#x27;,approved:&#x27;已通过&#x27;,failed:&#x27;需要处理&#x27;,stopped:&#x27;已停止&#x27;};
    const esc=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
    const task=()=&gt;tasks.find(t=&gt;t.id===state.selected);

    const criteria=t=&gt;`&lt;ul&gt;${t.criteria.map(c=&gt;`&lt;li&gt;${esc(c)}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;`;
    function say(text){announcement.textContent=text;}
    let drag=null, suppressClick=false, previous=null;
    const columns=[&#x27;todo&#x27;,&#x27;running&#x27;,&#x27;review&#x27;,&#x27;approved&#x27;];
    const columnOf=t=&gt;[&#x27;failed&#x27;,&#x27;stopped&#x27;].includes(t.status)?&#x27;todo&#x27;:t.status;
    function render(){

      if(state.page===&#x27;board&#x27;){
        main.innerHTML=`&lt;div class=&quot;heading&quot;&gt;&lt;div&gt;&lt;h1&gt;工作调度&lt;/h1&gt;&lt;span class=&quot;muted&quot;&gt;把想法交给 Agent，把结果留给你审查。&lt;/span&gt;&lt;/div&gt;${button(&#x27;＋ 新建任务&#x27;,&#x27;new&#x27;,true)}&lt;/div&gt;${!state.configured?`&lt;div class=&quot;notice row&quot;&gt;&lt;span&gt;执行前还需配置模型。你可以先整理任务。&lt;/span&gt;&lt;span class=&quot;spacer&quot;&gt;&lt;/span&gt;${button(&#x27;配置模型&#x27;,&#x27;setup&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;columns&quot;&gt;${[&#x27;todo&#x27;,&#x27;running&#x27;,&#x27;review&#x27;,&#x27;approved&#x27;].map(s=&gt;{const list=tasks.filter(t=&gt;s===&#x27;todo&#x27;?[&#x27;todo&#x27;,&#x27;failed&#x27;,&#x27;stopped&#x27;].includes(t.status):t.status===s);return `&lt;section class=&quot;column&quot;&gt;&lt;h3&gt;${names[s]}&lt;span&gt;${list.length}&lt;/span&gt;&lt;/h3&gt;${list.length?list.map(t=&gt;`&lt;button class=&quot;task&quot; style=&quot;padding:${state.compact?12:16}px&quot; data-task=&quot;${t.id}&quot;&gt;&lt;small&gt;任务 ${String(t.id).padStart(2,&#x27;0&#x27;)}&lt;/small&gt;&lt;strong&gt;${esc(t.title)}&lt;/strong&gt;&lt;small&gt;${t.status===&#x27;review&#x27;?&#x27;等待你检查结果&#x27;:t.status===&#x27;approved&#x27;?&#x27;已确认 · 待自行合入&#x27;:t.status===&#x27;running&#x27;?&#x27;正在执行 · 查看最新活动&#x27;:t.status===&#x27;failed&#x27;?&#x27;执行失败 · 查看原因&#x27;:t.status===&#x27;stopped&#x27;?&#x27;已停止 · 可以重新执行&#x27;:`${t.criteria.length} 项验收条件`}&lt;/small&gt;&lt;/button&gt;`).join(&#x27;&#x27;):`&lt;div class=&quot;empty&quot;&gt;${s===&#x27;todo&#x27;?&#x27;还没有待办任务&#x27;:s===&#x27;running&#x27;?&#x27;当前没有任务执行&#x27;:s===&#x27;review&#x27;?&#x27;完成的任务会出现在这里&#x27;:&#x27;通过审查后移入此列&#x27;}&lt;/div&gt;`}&lt;/section&gt;`}).join(&#x27;&#x27;)}&lt;/div&gt;`;
      }else if(state.page===&#x27;new&#x27;){
