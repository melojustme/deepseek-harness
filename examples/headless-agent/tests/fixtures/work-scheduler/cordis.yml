# Isolated delivery scenario. The driver supplies temporary persistence and preset roots.

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: ''

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: !!js process.env.DSH_SCHEDULER_PROVIDER || 'deepseek-official'
    model: !!js process.env.DSH_SCHEDULER_MODEL || 'deepseek-v4-flash'

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: standard
    includeUserRoot: false
    roots:
      - path: !!js process.env.DSH_SCHEDULER_PRESET_ROOT
        trust: system

- id: session-persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SCHEDULER_RUNTIME_ROOT + '/sessions'
    compression: none

- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: sqlite
  name: '@deepseek-ai/dsh-storage-sqlite'
  config:
    path: !!js process.env.DSH_SCHEDULER_RUNTIME_ROOT + '/storage.sqlite'

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: sqlite

- id: workspace
  name: '@deepseek-ai/dsh-workspace'

- id: work-scheduler-store
  name: '@deepseek-ai/dsh-work-scheduler-store'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: work-scheduler-execution
  name: '@deepseek-ai/dsh-work-scheduler-execution-local'
  config:
    worktreeRoot: !!js process.env.DSH_SCHEDULER_RUNTIME_ROOT + '/worktrees'
    dispatchIntervalMs: 100

- id: filesystem
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_SCHEDULER_RUNTIME_ROOT
